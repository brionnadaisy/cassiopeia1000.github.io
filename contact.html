<!DOCTYPE html>
<html>
  <head>
    <title>Contact</title>
  </head>
  <style>
    h1 {
      text-align: center;
    }

    h2 {
      text-align: center;
    }

    p {
      text-align: center;
    }

    h4 {
      text-align: center;
    }

    h3 {
      text-align: center;
      color: white;
    }

    .image-container img {
      width: 150px;
      height: 150px;
      border-radius: 10px;
      object-fit: cover;
    }

    img:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    nav {
      color: blue;
      background-color: #0a0e27;
      align-items: center;
    }

    nav:hover {
      color: red;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: gold;
      margin: 0px;
      background: #0a0e27 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="10" cy="20" r="1" fill="white"/><circle cx="40" cy="60" r="1" fill="white"/></svg>');
      min-height: 100vh;
      text-align: center;
    }

    h3 {
      transition: all 0.3s;
      padding: 10px 20px;
      border-radius: 5px;
      display: inline-block;
      width: auto;
    }

    h3:hover {
      background-color: white;
      color: black;
      border-radius: 10px;
      padding: 10px 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    a {
      color: blue;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      padding: 5px 10px;
      border-radius: 5px;
    }

    a:hover {
      background-color: #FFD700;
      color: silver;
      border-radius: 10px;
      padding: 8px 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    img {
      width: 150px;
      height: 150px;
      border-radius: 100px;
      object-fit: cover;
      cursor: pointer;
    }

    .fireworks-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      pointer-events: none;
    }

    @keyframes explode {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    .particle {
      animation: explode 1s ease-out forwards;
    }

    .contact-form {
      background-color: rgba(255, 255, 255, 0.1);
      border: 2px solid #FFD700;
      border-radius: 10px;
      padding: 30px;
      max-width: 500px;
      margin: 30px auto;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .contact-form h2 {
      color: #FFD700;
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      color: white;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #FFD700;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      background-color: #1a1a2e;
      color: gold;
      box-sizing: border-box;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      background-color: #0a0e27;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .submit-btn {
      background-color: #FFD700;
      color: black;
      padding: 12px 30px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }

    .submit-btn:hover {
      background-color: #FFC700;
      transform: scale(1.05);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
  </style>
  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="about-me.html">About Me</a>
      <a href="Projects.html">Projects</a>
      <a href="relax.html">relax</a>
      <a href="contact.html">Contact</a>
    </nav>
    <h1 onclick="createFireworks(event)">contact</h1>
    <h2>contact</h2>
    <img src="https://i.postimg.cc/0NgzSx1P/1D3A5046.jpg" onclick="createFireworks(event)"><br>
    <h3>contact me via email</h3><br>
    <h3>do not feel shy to contact me and ask me questions about my portfolio website dankee!💖💗💓💞💕</h3><br>
    <h2>email adress: ngamije.brionna31@ntare-louisenlund</h2>

    <div class="contact-form">
      <h2>Send me a Message</h2>
      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="form-group">
          <label for="name">Your Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Your Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">Your Message:</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>

    <div class="fireworks-container" id="fireworksContainer"></div>

    <footer>
      <p>&copy; 2025 Brionna's Portfolio. All rights reserved.</p>
    </footer>

    <script>
      function createFireworks(event) {
        const colors = ['#FF0000', '#0000FF', '#FFFF00'];
        const container = document.getElementById('fireworksContainer');
        const x = event.clientX;
        const y = event.clientY;

        for (let i = 0; i < 30; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          const color = colors[Math.floor(Math.random() * colors.length)];
          particle.style.background = color;
          particle.style.width = '10px';
          particle.style.height = '10px';
          particle.style.borderRadius = '50%';
          particle.style.left = x + 'px';
          particle.style.top = y + 'px';

          const angle = (Math.PI * 2 * i) / 30;
          const distance = 100 + Math.random() * 100;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;

          particle.style.setProperty('--tx', tx + 'px');
          particle.style.setProperty('--ty', ty + 'px');

          container.appendChild(particle);
          setTimeout(() => particle.remove(), 1000);
        }
      }
    </script>
  </body>
</html>
